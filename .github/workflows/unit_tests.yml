name: Unit Tests

on:
  push:
    branches: [ master, v3 ]
  pull_request:
    branches: [ master, v3 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer
        env:
          update: true

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Check PHP Version
        run: php --version

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHPUnit tests
        run: XDEBUG_MODE=coverage vendor/bin/phpunit --testsuite "Unit" --coverage-text