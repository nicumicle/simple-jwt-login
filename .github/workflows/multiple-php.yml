name: "Plugin Compatibility Across Multiple PHP Versions"

on:
  push:
    branches: [ master, v3 ]
  pull_request:
    branches: [ master, v3 ]

permissions:
  contents: read

jobs:
  # Check there is no syntax errors in the project
  php-linter:
    name: Validate Plugin Code Across Multiple PHP Versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '5.5', '5.6', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: PHP Syntax Checker (${{ matrix.php }})
        working-directory: simple-jwt-login/
        run: |
          php -v
          find . -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
