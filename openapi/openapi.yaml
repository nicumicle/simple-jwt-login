  /auth/2fa:
    post:
      tags:
        - authenticate_user
      summary: Verify Two-Factor Authentication code
      description: |
        Completes the Two-Factor Authentication challenge issued by `POST /auth`. When
        credentials are valid but the user has 2FA enabled, `POST /auth` returns an interim
        JWT (`two_factor_required: true`). This endpoint accepts that interim token together
        with the user's 2FA code and, on success, returns the final signed JWT.

        **Requirements**
        - Authentication must be enabled in the plugin settings.
        - The Two-Factor Authentication plugin must be installed and active.
        - The interim JWT must be provided via the `Authorization: Bearer` header or the
          `JWT` body field.
        - The `code` field must contain the TOTP code, email token, or backup code,
          depending on the user's configured 2FA provider.

        **Failed codes and reuse**
        - Each wrong code counts as a failed attempt for the Two Factor plugin (its rate
          limit then answers with error code 108) and fires `wp_login_failed`.
        - After too many wrong codes (30 by default, filter `two_factor_failed_attempt_limit`)
          the user's password is reset and emailed, and the call answers error code 109 with
          a message asking the user to check their email.
        - An interim JWT can be exchanged only once: after a valid code, call `POST /auth`
          again to start a new two-factor login.

        **JWT delivery**
        The interim JWT can be passed via:
        - `JWT` field in the request body
        - `Authorization: Bearer <token>` header (when enabled in plugin General Settings)
      operationId: verifyTwoFactor
      security:
        - BearerAuth: []
      requestBody:
        description: Interim JWT and 2FA verification code.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/twoFactorVerifyBody'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/twoFactorVerifyBody'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/twoFactorVerifyBody'
      responses:
        '200':
          description: 2FA verification successful. Returns a signed JWT and optional refresh token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      jwt:
                        type: string
                        description: Signed JWT for use in subsequent requests.
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
                      refresh_token:
                        type: string
                        nullable: true
                        description: |
                          Opaque refresh token. Only present when the refresh-token feature
                          is enabled in the plugin settings.
                        example: "a1b2c3d4e5f678901234567890123456789012345678901234567890123456789012"
        '400':
          description: |
            The interim JWT could not be decoded or validated (JWT library error), for example, it
            expired (`error_code` 14) or its signature is wrong (`error_code` 11). Also returned
            when the final JWT cannot be signed (`error_code` 16).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Expired token"
                  error_code: 14
        '401':
          description: |
            Unauthorized. One of:
            - The interim JWT has no `tfa_user_id` / `tfa_nonce` claims (`error_code` 106).
            - The interim JWT was already used, or its 2FA session expired (`error_code` 107).
            - The 2FA code is wrong (`error_code` 109). After too many wrong codes the
              message asks the user to check their email (the password was reset).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                wrongCode:
                  value:
                    success: false
                    data:
                      message: "Invalid two-factor code."
                      error_code: 109
                sessionExpired:
                  value:
                    success: false
                    data:
                      message: "Invalid or expired two-factor session. Please authenticate again."
                      error_code: 107
        '403':
          description: |
            Forbidden. One of:
            - Authentication is disabled in the plugin settings (`error_code` 45).
            - The Two-Factor Authentication plugin is not active (`error_code` 105).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Two-factor authentication plugin is not active."
                  error_code: 105
        '404':
          description: The WordPress user referenced by the interim JWT could not be found (`error_code` 24).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "User not found."
                  error_code: 24
        '422':
          description: |
            Unprocessable entity. One of:
            - The interim JWT is missing from the request (`error_code` 23).
            - The JWT is not an interim 2FA token (no `tfa_pending` claim, `error_code` 106).
            - The `code` field is missing or empty (`error_code` 109).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                missingJwt:
                  value:
                    success: false
                    data:
                      message: "Interim JWT is missing."
                      error_code: 23
                notInterim:
                  value:
                    success: false
                    data:
                      message: "A valid interim two-factor JWT is required."
                      error_code: 106
                missingCode:
                  value:
                    success: false
                    data:
                      message: "The two-factor code is missing."
                      error_code: 109
        '429':
          description: Too many failed attempts, the Two Factor plugin rate limit applies (`error_code` 108).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Too many failed attempts. Please wait 60 seconds."
                  error_code: 108
  /oauth/token:
    get:
      tags:
        - oauth
      summary: Exchange OAuth authorization code for a WordPress JWT (GET)
      description: |
        Browser-redirect flow: exchanges a provider authorization code for a WordPress
        session and redirects the browser to the WordPress admin (or login page on failure).
        The provider must be enabled in the plugin settings.

        Supported providers: `google`, `auth0`, `facebook`, `github`.

        Auth codes, IP allow-lists and the "Authentication enabled" setting do not apply to
        this endpoint; only the provider must be enabled.

        **Login start** - `provider` only (no `code`, no `error`): the login buttons point
        here. The plugin stores a random `state` in a 10-minute HttpOnly cookie
        (`sjl_oauth_state_<provider>`) and answers `302` to the provider's consent screen
        with that `state`.

        **Callback** - the provider redirects back with `code` and `state`. The callback is
        only accepted when `state` matches the cookie of the same browser (login CSRF
        protection); the cookie is single use. Otherwise the code is not exchanged and the
        browser is redirected to the login page with an error (`error_code` 129 in the audit
        log). Links that send visitors straight to the provider, without the login start,
        are rejected.

        If the OAuth identity matches an existing WordPress user (by email), the user is
        logged in. If no match is found and "Register on OAuth login" is enabled, a new
        user is created automatically. On failure the browser is redirected to the
        WordPress login page.

        > **Note**: this endpoint is designed for browser redirect callbacks (OAuth consent
        > screen `redirect_uri`). To obtain a JWT programmatically, use `POST /oauth/token`
        > instead.
      operationId: oauthTokenGet
      parameters:
        - name: provider
          in: query
          required: true
          description: OAuth provider slug.
          schema:
            type: string
            enum: [google, auth0, facebook, github]
          example: google
        - name: code
          in: query
          description: Authorization code returned by the OAuth provider's consent screen.
          schema:
            type: string
        - name: state
          in: query
          description: |
            Returned by the provider on the callback. Must match the `sjl_oauth_state_<provider>`
            cookie set by the login start.
          schema:
            type: string
        - name: error
          in: query
          description: |
            Sent by the provider instead of `code` when the login failed (for example, `access_denied`).
            A request with `error` is not treated as a login start.
          schema:
            type: string
      responses:
        '200':
          description: |
            The user has Two-Factor enabled: a small HTML page redirects the browser (meta
            refresh + JavaScript) to the `wp-login.php?action=validate_2fa` form of the Two Factor
            plugin. The session starts only after a valid code.
          content:
            text/html:
              example: '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=https://example.com/wp-login.php?action=validate_2fa&..."></head><body></body></html>'
        '302':
          description: |
            One of:
            - Login start (`provider` only): redirect to the provider's consent screen with
              `client_id`, `redirect_uri`, `response_type=code`, `scope` and `state`, plus a
              `Set-Cookie: sjl_oauth_state_<provider>` header.
            - Callback success: the user is logged in (created first when "Register on OAuth
              login" is on) and redirected to the WordPress admin.
            - Callback failure (invalid `state`, code rejected by the provider, or user not found):
              redirect to `wp-login.php` with an `error` query parameter.
          headers:
            Location:
              schema:
                type: string
              example: "https://accounts.google.com/o/oauth2/v2/auth?client_id=...&redirect_uri=...&response_type=code&scope=...&state=..."
        '403':
          description: The requested OAuth provider is not enabled in the plugin settings (`error_code` 70).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "This Oauth provider is not available."
                  error_code: 70
        '422':
          description: |
            Unprocessable entity. One of:
            - `provider` is missing or unknown (`error_code` 69).
            - The provider sent back an `error` without a `code` (for example, the user denied
              consent): the request has neither `code` nor the token parameter
              (`error_code` 71 Google, 77 Auth0, 97 Facebook, 101 GitHub).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                invalidProvider:
                  value:
                    success: false
                    data:
                      message: "The Oauth provider is invalid."
                      error_code: 69
                missingCode:
                  value:
                    success: false
                    data:
                      message: "The code or id_token parameter is missing from request."
                      error_code: 71
    post:
      tags:
        - oauth
      summary: Exchange OAuth token for a WordPress JWT (POST)
      description: |
        API flow: exchanges a provider-issued token for a WordPress JWT and returns the
        WordPress user profile. Use this variant for programmatic API clients. The provider
        must be enabled in the plugin settings.

        Supported providers: `google`, `auth0`, `facebook`, `github`.

        **Google** - supply `code` (authorization code) or `id_token` (Google Sign-In ID
        token). The `id_token` path returns a WordPress JWT directly; the `code` path
        returns the raw Google token response for the client to handle. The `id_token` must
        be issued for the configured client ID (unless "Allow tokens issued for other Google
        clients" is enabled in the Google settings) and carry a verified email.

        **Auth0** - supply `code` (returns the raw Auth0 token response) or `access_token`
        (returns a WordPress JWT). The `access_token` must be a JWT issued for the configured
        Auth0 Client ID (`azp` or `aud`). Opaque access tokens are rejected (error code 79)
        unless "Allow opaque access tokens" is enabled in the Auth0 settings.
        The account email must be verified.

        The `code` flow sends the provider the "exchange code" Redirect URI saved in the
        provider settings, so the code must have been issued for that URI.

        **Facebook** - supply `access_token` (Facebook user access token). Returns a
        WordPress JWT. The token must have been issued for the configured Facebook app
        (checked with `debug_token`), and the App ID and App Secret must be set, unless
        "Allow tokens issued for other Facebook apps" is enabled in the Facebook settings.

        **GitHub** - supply `access_token` (GitHub user access token). Returns a
        WordPress JWT. The token must have been issued for the configured GitHub OAuth
        app (personal access tokens are rejected), and the Client ID and Client Secret
        must be set, unless "Allow tokens issued for other GitHub apps" is enabled in the
        GitHub settings.

        If the OAuth identity matches an existing WordPress user (by email), a WordPress
        JWT is returned. If no match is found and "Register on OAuth login" is enabled, a
        new user is created automatically.
      operationId: oauthTokenPost
      requestBody:
        description: OAuth provider and authorization code, ID token, or access token.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/oauthBody'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/oauthBody'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/oauthBody'
        required: true
      responses:
        '200':
          description: |
            One of:
            - `id_token` / `access_token` flow: a WordPress JWT, or a 2FA challenge
              (`two_factor_required: true`, finish with `POST /auth/2fa`) when the user has
              Two-Factor enabled and the 2FA integration is on.
            - `code` flow: the raw token response of the provider, unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthResponse'
              examples:
                jwt:
                  summary: id_token / access_token flow
                  value:
                    success: true
                    data:
                      jwt: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NjMyOTk0MDAsImVtYWlsIjoiam9obkBkb2UuY29tIn0.signature"
                twoFactorChallenge:
                  summary: User has Two-Factor enabled
                  value:
                    success: true
                    data:
                      jwt: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ0ZmFfcGVuZGluZyI6MX0.signature"
                      two_factor_required: true
                      provider: "Two_Factor_Totp"
                code:
                  summary: code flow (Google example)
                  value:
                    success: true
                    data:
                      access_token: "ya29.a0Af..."
                      expires_in: 3599
                      scope: "openid https://www.googleapis.com/auth/userinfo.email"
                      token_type: "Bearer"
                      id_token: "eyJhbGciOiJSUzI1NiIs..."
        '400':
          description: The WordPress JWT could not be signed (JWT library error, for example, `error_code` 16).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "OpenSSL unable to sign data"
                  error_code: 16
        '401':
          description: |
            Unauthorized. One of:
            - The authorization code was rejected by the provider (`error_code` 72 Google,
              78 Auth0, 98 Facebook, 102 GitHub). The provider error is appended to the message.
            - The `id_token` / `access_token` is invalid, expired, or issued by another
              issuer or for another application (`error_code` 73 Google, 79 Auth0,
              99 Facebook, 103 GitHub).
            - The Google `id_token` was issued for another client ID (`error_code` 118).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                invalidIdToken:
                  value:
                    success: false
                    data:
                      message: "The provided id_token is invalid"
                      error_code: 73
                invalidGithubToken:
                  value:
                    success: false
                    data:
                      message: "The provided GitHub access_token is invalid."
                      error_code: 103
                wrongAudience:
                  value:
                    success: false
                    data:
                      message: "The provided id_token was not issued for this website."
                      error_code: 118
                invalidCode:
                  value:
                    success: false
                    data:
                      message: "The code you provided is invalid.Bad Request. Invalid_grant"
                      error_code: 72
        '403':
          description: |
            Forbidden. One of:
            - The requested OAuth provider is not enabled in the plugin settings (`error_code` 70).
            - The account email is not verified, for Auth0 (`error_code` 111), GitHub (`error_code` 112),
              Google `id_token` (`error_code` 119).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                providerDisabled:
                  value:
                    success: false
                    data:
                      message: "This Oauth provider is not available."
                      error_code: 70
                emailNotVerified:
                  value:
                    success: false
                    data:
                      message: "The email address of this Google account is not verified."
                      error_code: 119
        '404':
          description: |
            The identity email matches no WordPress user and "Register on OAuth login" is off
            (`error_code` 74 Google, 80 Auth0, 100 Facebook, 104 GitHub).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Wrong user credentials."
                  error_code: 74
        '422':
          description: |
            Unprocessable entity. One of:
            - `provider` is missing or unknown (`error_code` 69).
            - Neither `code` nor the token parameter was sent (`error_code` 71 Google, 77 Auth0,
              97 Facebook, 101 GitHub).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                invalidProvider:
                  value:
                    success: false
                    data:
                      message: "The Oauth provider is invalid."
                      error_code: 69
                missingParam:
                  value:
                    success: false
                    data:
                      message: "The code or access_token parameter is missing from request."
                      error_code: 97
        '500':
          description: |
            Internal server error. One of:
            - The 2FA nonce could not be created (`error_code` 133).
            - The new user could not be created (`error_code` 52).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Unable to create two-factor nonce."
                  error_code: 133
  /api-keys:
    get:
      tags:
        - api_keys
        - internal
      summary: List API keys
      description: |
        Returns a paginated list of API keys, newest first. Administrators (`manage_options`)
        see the keys of every user (with `user_id`); other users see only their own keys.

        The full key value is never returned; only the first 8 characters are shown
        (followed by `****`).

        **Authentication**
        The WordPress user must be authenticated: a logged-in session (cookie plus the
        `X-WP-Nonce` header for REST calls), or a JWT in the header or cookie. Without it
        WordPress answers `401` `rest_forbidden` before the plugin runs.

        **Error format**
        API key errors are `WP_Error` responses (`code: simple_jwt_login_api_key_error`).
        When the API middleware or API keys are enabled they are rewritten into the plugin
        envelope (`{"success": false, "data": {"message", "error_code"}}`); see `ApiKeyError`.
      operationId: listApiKeys
      security:
        - WordPressSession: []
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (1-based). Values below 1 are treated as 1.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: per_page
          in: query
          description: Number of results per page. Clamped to 1-100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: Paginated list of API keys.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ApiKeyItem'
                      total:
                        type: integer
                        description: Total number of matching keys.
                        example: 1
                      page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 20
              example:
                success: true
                data:
                  items:
                    - id: 7
                      name: "My integration key"
                      key_prefix: "sjl_a1b2****"
                      permissions: ["read", "create"]
                      expires_at: null
                      last_used_at: "2026-11-15 20:11:38"
                      created_at: "2026-11-15 20:11:37"
                      revoked_at: null
                      user_id: 1
                  total: 1
                  page: 1
                  per_page: 20
        '401':
          $ref: '#/components/responses/RestForbidden'
        '403':
          description: The user is not logged in (`error_code` 84).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyError'
              example:
                code: simple_jwt_login_api_key_error
                message: "You must be logged in to manage API keys."
                data:
                  status: 403
                  error_code: 84
    post:
      tags:
        - api_keys
        - internal
      summary: Create an API key
      description: |
        Generates a new API key for the authenticated WordPress user. The full key value
        (`sjl_` prefix + 32 hex characters) is returned **only in this response** - it
        cannot be retrieved again. Store it securely immediately.

        **Permissions**
        One or more of: `read`, `create`, `update`, `delete`. These map to the HTTP methods
        the key may be used to authenticate: GET, POST, PUT/PATCH, and DELETE respectively.
        Non-administrators can only grant permissions they have themselves:
        `read` needs `read`, `create` / `update` need `edit_posts`, `delete` needs `delete_posts`.

        **Requirements**
        - The user must be authenticated (see `GET /api-keys`).
        - `name` is required and must be non-empty.
        - At least one valid permission must be specified.
      operationId: createApiKey
      security:
        - WordPressSession: []
        - BearerAuth: []
      requestBody:
        description: API key definition.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createApiKeyBody'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/createApiKeyBody'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/createApiKeyBody'
      responses:
        '200':
          description: |
            API key created. The `key` field contains the full plaintext key - save it now
            as it isn't returned again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Database ID of the newly created key.
                        example: 7
                      key:
                        type: string
                        description: Full plaintext API key. Store securely - shown only once.
                        example: "sjl_a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
                      name:
                        type: string
                        example: "My integration key"
                      key_prefix:
                        type: string
                        description: First 8 characters of the key, for identification.
                        example: "sjl_a1b2"
                      permissions:
                        type: array
                        items:
                          type: string
                          enum: [read, create, update, delete]
                        example: ["read", "create"]
                      expires_at:
                        type: string
                        nullable: true
                        description: Expiry in UTC `Y-m-d H:i:s`, or null for no expiry.
                        example: "2027-01-01 00:00:00"
          links:
            UpdateApiKey:
              operationId: updateApiKey
              description: Update the key that was just created.
              parameters:
                id: '$response.body#/data/id'
            RevokeApiKey:
              operationId: revokeApiKey
              description: Revoke the key that was just created.
              parameters:
                id: '$response.body#/data/id'
            DeleteApiKey:
              operationId: deleteApiKey
              description: Delete the key that was just created.
              parameters:
                id: '$response.body#/data/id'
        '400':
          $ref: '#/components/responses/RestInvalidJson'
        '401':
          $ref: '#/components/responses/RestForbidden'
        '403':
          $ref: '#/components/responses/ApiKeyForbidden'
        '422':
          $ref: '#/components/responses/ApiKeyInvalidInput'
        '500':
          description: |
            The database insert failed (`error_code` 88).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyError'
              example:
                code: simple_jwt_login_api_key_error
                message: "Failed to create API key."
                data:
                  status: 500
                  error_code: 88
  /api-keys/{id}:
    put:
      tags:
        - api_keys
        - internal
      summary: Update an API key
      description: |
        Replaces the `name`, `permissions` and `expires_at` of an existing API key. All three
        are written on every call: `name` and `permissions` are required, and omitting
        `expires_at` removes the expiry. Regular users may only update their own keys and
        only grant permissions they have (see `POST /api-keys`). Administrators may update
        any key.
      operationId: updateApiKey
      security:
        - WordPressSession: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiKeyId'
      requestBody:
        description: Updated API key fields.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateApiKeyBody'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/updateApiKeyBody'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/updateApiKeyBody'
      responses:
        '200':
          description: API key updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyActionResponse'
              example:
                success: true
                message: "API key updated successfully."
        '400':
          $ref: '#/components/responses/RestInvalidJson'
        '401':
          $ref: '#/components/responses/RestForbidden'
        '403':
          $ref: '#/components/responses/ApiKeyForbidden'
        '404':
          $ref: '#/components/responses/ApiKeyNotFound'
        '422':
          $ref: '#/components/responses/ApiKeyInvalidInput'
        '500':
          description: |
            The update failed, including an administrator updating a key id that does not
            exist (`error_code` 90).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyError'
              examples:
                updateFailed:
                  value:
                    code: simple_jwt_login_api_key_error
                    message: "Failed to update API key."
                    data:
                      status: 500
                      error_code: 90
    delete:
      tags:
        - api_keys
        - internal
      summary: Permanently delete an API key
      description: |
        Permanently removes the API key record from the database. This action is
        irreversible. To merely disable a key while keeping its record, use
        `POST /api-keys/{id}/revoke` instead.

        Regular users may only delete their own keys. Administrators may delete any key.
      operationId: deleteApiKey
      security:
        - WordPressSession: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiKeyId'
      responses:
        '200':
          description: API key permanently deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyActionResponse'
              example:
                success: true
                message: "API key deleted successfully."
        '401':
          $ref: '#/components/responses/RestForbidden'
        '403':
          $ref: '#/components/responses/ApiKeyForbidden'
        '404':
          $ref: '#/components/responses/ApiKeyNotFound'
        '500':
          description: |
            The delete failed, including an administrator deleting a key id that does not
            exist (`error_code` 92).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyError'
              example:
                code: simple_jwt_login_api_key_error
                message: "Failed to delete API key."
                data:
                  status: 500
                  error_code: 92
  /api-keys/{id}/revoke:
    post:
      tags:
        - api_keys
        - internal
      summary: Revoke an API key
      description: |
        Soft-deletes (revokes) an API key by recording a `revoked_at` timestamp. The key
        record is retained in the database but is rejected by the authentication middleware.
        To permanently remove the record, use `DELETE /api-keys/{id}`.

        Regular users may only revoke their own keys. Administrators may revoke any key.
      operationId: revokeApiKey
      security:
        - WordPressSession: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiKeyId'
      responses:
        '200':
          description: API key revoked successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyActionResponse'
              example:
                success: true
                message: "API key revoked successfully."
        '401':
          $ref: '#/components/responses/RestForbidden'
        '403':
          $ref: '#/components/responses/ApiKeyForbidden'
        '404':
          $ref: '#/components/responses/ApiKeyNotFound'
        '500':
          description: |
            The revoke failed, including an administrator revoking a key id that does not
            exist (`error_code` 91).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyError'
              example:
                code: simple_jwt_login_api_key_error
                message: "Failed to revoke API key."
                data:
                  status: 500
                  error_code: 91
  /revoked-tokens:
    get:
      tags:
        - revoked_tokens
        - internal
      summary: List revoked tokens
      description: |
        Returns a paginated list of revoked-token records across all users, newest first.
        Tokens are stored hashed (SHA-256) - the raw JWT is never persisted or returned, only
        a masked prefix/suffix of the hash for identification.

        **Requirements**
        - The user must be authenticated (logged-in session with `X-WP-Nonce`, or a JWT in
          the header or cookie). Otherwise WordPress answers `401` `rest_forbidden`.
        - The user must have the `manage_options` capability (administrator).
      operationId: listRevokedTokens
      security:
        - WordPressSession: []
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (1-based). Values below 1 are treated as 1.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: per_page
          in: query
          description: Number of results per page. Clamped to 1-100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: Paginated list of revoked tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/RevokedTokenItem'
                      total:
                        type: integer
                        description: Total number of revoked-token records.
                        example: 1
                      page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 20
              example:
                success: true
                data:
                  items:
                    - id: 1713
                      user_id: 12
                      token_hash_masked: "cdac64f6...8738"
                      expires_at: "2026-11-16 05:25:32"
                      revoked_at: "2026-11-16 04:25:33"
                  total: 1
                  page: 1
                  per_page: 20
          links:
            DeleteRevokedToken:
              operationId: deleteRevokedToken
              description: Delete the first revoked-token record of the page.
              parameters:
                id: '$response.body#/data/items/0/id'
        '401':
          $ref: '#/components/responses/RestForbidden'
        '403':
          description: |
            The user is not an administrator (`error_code` 115).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "You must be an administrator to manage revoked tokens."
                  error_code: 115
  /revoked-tokens/{id}:
    delete:
      tags:
        - revoked_tokens
        - internal
      summary: Delete a revoked-token entry
      description: |
        Removes a revoked-token record. This un-revokes the underlying JWT - if it has not
        yet expired, it becomes valid again for authentication. Administrators only.
      operationId: deleteRevokedToken
      security:
        - WordPressSession: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the revoked-token record to delete.
          schema:
            type: integer
          example: 7
      responses:
        '200':
          description: Revoked-token entry deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyActionResponse'
              example:
                success: true
                message: "Revoked token entry deleted. If the token has not expired, it is valid again."
        '401':
          $ref: '#/components/responses/RestForbidden'
        '403':
          description: The user is not an administrator (`error_code` 115).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "You must be an administrator to manage revoked tokens."
                  error_code: 115
        '404':
          description: The id is invalid, or no record has it (`error_code` 116).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Invalid revoked token ID."
                  error_code: 116
        '500':
          description: The database delete failed (`error_code` 117).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Failed to delete revoked token entry."
                  error_code: 117
components:
  parameters:
    ApiKeyId:
      name: id
      in: path
      required: true
      description: Numeric ID of the API key.
      schema:
        type: integer
        minimum: 1
      example: 7
  responses:
    RestInvalidJson:
      description: |
        WordPress core error: the `application/json` body is not valid JSON (for example,
        malformed UTF-8). The plugin is not called.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WpRestError'
          example:
            code: rest_invalid_json
            message: "Invalid JSON body passed."
            data:
              status: 400
    RestForbidden:
      description: |
        WordPress core error: the request is not authenticated (no logged-in session with a
        valid `X-WP-Nonce`, and no valid JWT in the header or cookie). The plugin is not called.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WpRestError'
          example:
            code: rest_forbidden
            message: "Sorry, you are not allowed to do that."
            data:
              status: 401
    ApiKeyForbidden:
      description: |
        Forbidden (`error_code` 84). One of:
        - The user is not logged in.
        - The user does not own this API key and is not an administrator.
        - A non-administrator tries to grant a permission they do not have.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiKeyError'
          example:
            code: simple_jwt_login_api_key_error
            message: "You are not allowed to manage this API key."
            data:
              status: 403
              error_code: 84
    ApiKeyNotFound:
      description: The id is not a positive number (`error_code` 89).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiKeyError'
          example:
            code: simple_jwt_login_api_key_error
            message: "Invalid API key ID."
            data:
              status: 404
              error_code: 89
    ApiKeyInvalidInput:
      description: |
        Unprocessable entity. One of:
        - `name` is empty (`error_code` 85).
        - No permission was given (`error_code` 86) or a permission is unknown (`error_code` 87).
        - `expires_at` is not a valid date (`error_code` 132).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiKeyError'
          examples:
            missingName:
              value:
                code: simple_jwt_login_api_key_error
                message: "API key name is required."
                data:
                  status: 422
                  error_code: 85
            invalidPermission:
              value:
                code: simple_jwt_login_api_key_error
                message: "Invalid permission: admin"
                data:
                  status: 422
                  error_code: 87
            invalidExpiry:
              value:
                code: simple_jwt_login_api_key_error
                message: "The expires_at value must be a date such as 2030-01-31 or 2030-01-31 23:59:00 (UTC)."
                data:
                  status: 422
                  error_code: 132
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT passed in the `Authorization` header as `Bearer <token>`.
        The header key name is configurable in plugin General Settings (default: `Authorization`).
        This scheme must be enabled in the plugin General Settings under **JWT from Header**.
    QueryJWT:
      type: apiKey
      in: query
      name: JWT
      description: |
        JWT passed as a URL query parameter. The parameter name defaults to `JWT` but is
        configurable in plugin General Settings under **Request Keys**.
    WordPressSession:
      type: apiKey
      in: cookie
      name: wordpress_logged_in
      description: |
        WordPress logged-in cookie (`wordpress_logged_in_<hash>`). For REST calls WordPress
        also needs the `X-WP-Nonce` header (`wp_rest` nonce), otherwise the request is
        treated as logged out. Used by the `/api-keys` and `/revoked-tokens` endpoints,
        which also accept a JWT (`BearerAuth`).
  schemas:
    WpRestError:
      type: object
      description: Standard WordPress REST API error.
      properties:
        code:
          type: string
          example: rest_forbidden
        message:
          type: string
          example: "Sorry, you are not allowed to do that."
        data:
          type: object
          properties:
            status:
              type: integer
              example: 401
            error_code:
              type: integer
              description: Plugin error code. Only on plugin errors.
              example: 84
    ApiKeyError:
      description: |
        API key endpoint error. A `WP_Error` (`code: simple_jwt_login_api_key_error`) by
        default; rewritten into the plugin envelope (`ResponseError`) when the API middleware
        or API keys are enabled in the plugin settings.
      anyOf:
        - $ref: '#/components/schemas/WpRestError'
        - $ref: '#/components/schemas/ResponseError'
    ApiKeyActionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "API key updated successfully."
    ResponseError:
      type: object
      properties:
        success:
          type: boolean
          example: false
          description: Always `false` for error responses.
        data:
          type: object
          properties:
            message:
              type: string
              description: Human-readable error description.
              example: "An error occurred."
            error_code:
              type: number
              description: |
                Internal error code. Use this for programmatic error handling.
                See the plugin source (`ErrorCodes.php`) for the full list of codes.
              example: 22
    registerUserBody:
      type: object
      description: |
        Only the fields below are passed to `wp_insert_user()`; any other field is ignored.
        Roles come from the plugin settings (or from the auth code), never from the request.
      required:
        - email
      properties:
        email:
          type: string
          example: test@simplejwtlogin.com
          description: User email address. Must be unique, well-formed and at most 60 characters when `user_login` is omitted.
        password:
          type: string
          description: |
            Plaintext password for the new account. Required unless "Random password" is
            enabled in the plugin settings (then it is ignored and a random one is generated).
          example: "MyS3cretP@ss"
        user_login:
          type: string
          nullable: true
          description: The user's login username (max 60 characters). Defaults to the email address if omitted.
          example: myuser
        user_nicename:
          type: string
          nullable: true
          description: URL-friendly version of the username (used in author URLs).
          example: myuser
        user_url:
          type: string
          nullable: true
          description: URL associated with the user's profile.
          example: https://simplejwtlogin.com
        display_name:
          type: string
          nullable: true
          description: The user's display name. Defaults to `user_login` if omitted.
          example: My User
        nickname:
          type: string
          nullable: true
          description: The user's nickname. Defaults to `user_login` if omitted.
          example: myuser
        first_name:
          type: string
          nullable: true
          description: The user's first name.
          example: John
        last_name:
          type: string
          nullable: true
          description: The user's last name.
          example: Doe
        description:
          type: string
          nullable: true
          description: The user's biographical description.
          example: This is a sample description
        rich_editing:
          type: string
          nullable: true
          description: Whether to enable the rich-editor. Accepts `'true'` or `'false'` as a string literal. Defaults to `'true'`.
          example: "true"
        syntax_highlighting:
          type: string
          nullable: true
          description: Whether to enable the rich code editor. Accepts `'true'` or `'false'` as a string literal. Defaults to `'true'`.
          example: "true"
        comment_shortcuts:
          type: string
          nullable: true
          description: Whether to enable comment moderation keyboard shortcuts. Accepts `'true'` or `'false'` as a string literal. Defaults to `'false'`.
          example: "false"
        admin_color:
          type: string
          nullable: true
          description: Admin color scheme for the user. Defaults to `'fresh'`.
          example: fresh
        use_ssl:
          type: boolean
          nullable: true
          description: Whether the user should always access the admin over HTTPS. Defaults to `false`.
          example: false
        show_admin_bar_front:
          type: string
          nullable: true
          description: Whether to display the Admin Bar on the front end. Accepts `'true'` or `'false'` as a string literal. Defaults to `'true'`.
          example: "true"
        locale:
          type: string
          nullable: true
          description: User's locale. Defaults to empty (inherits site locale).
          example: "en_US"
        user_meta:
          description: |
            Optional user meta to set on the new account. Accepted as a JSON-encoded
            object string or as a plain object. Only keys listed in "Allowed user meta"
            in the plugin settings are stored; all others are silently discarded.
          example: '{"billing_city":"New York"}'
          oneOf:
            - type: string
              nullable: true
            - type: object
              additionalProperties:
                type: string
        AUTH_KEY:
          type: string
          nullable: true
          example: "MY_SUPER_SECRET_AUTH_CODE"
          description: |
            Required when "Register Requires Auth Code" is enabled in the plugin settings.
            When sent, it is always validated (`401`, `error_code` 27 if wrong), and the role
            linked to the auth code, if any, is given to the new user. The parameter name
            defaults to `AUTH_KEY` but is configurable in the plugin's Auth Codes settings.
    authBody:
      type: object
      properties:
        email:
          type: string
          nullable: true
          example: john@doe.com
          description: User email address. Required when neither `username` nor `login` is provided.
        username:
          type: string
          nullable: true
          example: myuser
          description: WordPress login username. Required when neither `email` nor `login` is provided.
        login:
          type: string
          nullable: true
          example: myuser
          description: |
            Combined identifier accepted as either an email address or a WordPress login
            username. Required when neither `email` nor `username` is provided.
        password:
          type: string
          nullable: true
          description: |
            User plaintext password. Required when `password_hash` is not provided.
            When "Base64-encoded password" is enabled in the plugin settings, supply the
            password base64-encoded and it is decoded server-side before verification.
        password_hash:
          type: string
          nullable: true
          description: |
            Hashed password as stored in the WordPress database. Requires "Allow login with
            password hash" to be enabled in the plugin settings (`error_code` 113 when not
            enabled). Required when `password` is not provided. When "Base64-encoded
            password" is enabled, supply the hash base64-encoded.
        AUTH_KEY:
          type: string
          nullable: true
          example: "MY_SUPER_SECRET_AUTH_CODE"
          description: |
            Required when "Authentication Requires Auth Code" is enabled. The parameter
            name defaults to `AUTH_KEY` but is configurable in the plugin's Auth Codes
            settings.
        payload:
          oneOf:
            - type: string
              nullable: true
              example: '{"department":"engineering","region":"eu"}'
            - type: object
              example: {"department": "engineering", "region": "eu"}
          description: |
            Optional extra claims merged into the JWT payload. Accepted either as a
            JSON-encoded string (form-encoded/query-string requests) or as a native
            JSON object (JSON body requests).
            Reserved identity claims configured in the plugin's payload settings (for example,
            `email`, `id`, `username`, `site`, `iss`, `exp`, `iat`) and the custom
            "Login by parameter" claim, if configured, are always stripped from this
            value and set from the authenticated user instead - they cannot be
            overridden by the caller.
    authRefreshBody:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: "a1b2c3d4e5f678901234567890123456789012345678901234567890123456789012"
          description: Refresh token obtained from a prior `/auth` response.
        AUTH_KEY:
          type: string
          nullable: true
          example: "MY_SUPER_SECRET_AUTH_CODE"
          description: |
            Required when "Refresh Token Requires Auth Code" is enabled. The parameter
            name defaults to `AUTH_KEY` but is configurable in the plugin's Auth Codes
            settings.
        payload:
          oneOf:
            - type: string
              nullable: true
              example: '{"department":"engineering","region":"eu"}'
            - type: object
              example: {"department": "engineering", "region": "eu"}
          description: |
            Optional extra claims merged into the newly issued JWT payload. Accepted
            either as a JSON-encoded string (form-encoded/query-string requests) or as a
            native JSON object (JSON body requests).
            Reserved identity claims configured in the plugin's payload settings (for example,
            `email`, `id`, `username`, `site`, `iss`, `exp`, `iat`) and the custom
            "Login by parameter" claim, if configured, are always stripped from this
            value and set from the authenticated user instead - they cannot be
            overridden by the caller.
    validateBody:
      type: object
      properties:
        JWT:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
          description: |
            The JWT to validate. Optional when the JWT is sent in the `Authorization` header,
            cookie, or session instead.
        AUTH_KEY:
          type: string
          nullable: true
          example: "MY_SUPER_SECRET_AUTH_CODE"
          description: |
            Required when "Validate Token Requires Auth Code" is enabled. The parameter
            name defaults to `AUTH_KEY` but is configurable in the plugin's Auth Codes
            settings.
    authRevokeBody:
      type: object
      properties:
        JWT:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
          description: |
            The JWT to revoke. It must be valid and not expired. Optional when the JWT is sent
            in the `Authorization` header, cookie, or session instead.
        AUTH_KEY:
          type: string
          nullable: true
          example: "MY_SUPER_SECRET_AUTH_CODE"
          description: |
            Required when "Revoke Token Requires Auth Code" is enabled. The parameter
            name defaults to `AUTH_KEY` but is configurable in the plugin's Auth Codes
            settings.
    resetPasswordBody:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          example: contact@simplejwtlogin.com
          description: Email address of the account to reset.
        AUTH_KEY:
          type: string
          nullable: true
          example: "MY_SUPER_SECRET_AUTH_CODE"
          description: |
            Required when "Reset Password Requires Auth Code" is enabled. The parameter
            name defaults to `AUTH_KEY` but is configurable in the plugin's Auth Codes
            settings.
    changePasswordBody:
      type: object
      required:
        - email
        - new_password
      properties:
        email:
          type: string
          example: contact@simplejwtlogin.com
          description: Email address of the account whose password to change.
        code:
          type: string
          nullable: true
          example: "MY_SECRET_CODE_RECEIVED_BY_EMAIL"
          description: |
            One-time reset code received by email (from `POST /user/reset_password`).
            Required in code-based reset flow; not required when `JWT` is provided and
            JWT-based reset is enabled.
        new_password:
          type: string
          example: "NewSecurePassword123!"
          description: |
            The new password to set for the account. Base64-encoded when "Password is base64
            encoded" is enabled in the authentication settings.
        JWT:
          type: string
          nullable: true
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
          description: |
            Valid JWT for the user. Used only when "Allow Reset Password with JWT" is enabled
            and `code` is empty; the JWT user email must equal `email`. Can also be sent in the
            `Authorization` header, cookie, or session.
        AUTH_KEY:
          type: string
          nullable: true
          example: "MY_SUPER_SECRET_AUTH_CODE"
          description: |
            Required when "Reset Password Requires Auth Code" is enabled. The parameter
            name defaults to `AUTH_KEY` but is configurable in the plugin's Auth Codes
            settings.
    oauthBody:
      type: object
      required:
        - provider
      properties:
        provider:
          type: string
          enum: [google, auth0, facebook, github]
          description: OAuth provider slug.
          example: google
        code:
          type: string
          nullable: true
          description: |
            Authorization code returned by the OAuth provider's consent screen.
            Used by Google, Auth0, Facebook, and GitHub.
          example: "4/0AfJohXmX..."
        id_token:
          type: string
          nullable: true
          description: |
            Google ID token from Sign In With Google (Google provider only). Can be
            supplied instead of `code` to obtain a WordPress JWT directly.
          example: "eyJhbGci..."
        access_token:
          type: string
          nullable: true
          description: |
            Provider access token passed directly by the client. Used by Auth0
            (`provider=auth0`), Facebook (`provider=facebook`) and GitHub (`provider=github`)
            instead of `code`.
          example: "EAABs..."
    OAuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: |
            For the `code` flow, `data` is the provider's token response as returned by the
            provider (for example, `access_token`, `id_token`, `expires_in`, `token_type`).
          properties:
            jwt:
              type: string
              description: |
                WordPress JWT (`id_token` / `access_token` flow), or a short-lived interim JWT
                when `two_factor_required` is `true`.
              example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NjMyOTk0MDAsImVtYWlsIjoiam9obkBkb2UuY29tIn0.signature"
            two_factor_required:
              type: boolean
              nullable: true
              description: Present and `true` only for a 2FA challenge.
              example: true
            provider:
              type: string
              nullable: true
              description: Class name of the user's primary 2FA provider. Only with `two_factor_required`.
              example: "Two_Factor_Totp"
          additionalProperties: true
    createApiKeyBody:
      type: object
      required:
        - name
        - permissions
      properties:
        name:
          type: string
          description: Human-readable name to identify the key.
          example: "My integration key"
        permissions:
          description: |
            Array (or comma-separated string) of permissions to grant.
            Valid values: `read`, `create`, `update`, `delete`.
          oneOf:
            - type: array
              items:
                type: string
                enum: [read, create, update, delete]
            - type: string
          example: ["read", "create"]
        expires_at:
          type: string
          nullable: true
          description: |
            Optional expiry date/time, in UTC. Accepted forms: `Y-m-d`, `Y-m-d H:i[:s]` or
            ISO 8601 with an optional zone (`2027-01-01T00:00:00Z`, `+02:00`). A value without
            a zone is read as UTC; it is stored as UTC `Y-m-d H:i:s`. Any other value is
            rejected with `422` (`error_code` 132). Omit (or pass `null`) for a non-expiring key.
          example: "2027-01-01 00:00:00"
    updateApiKeyBody:
      type: object
      required:
        - name
        - permissions
      properties:
        name:
          type: string
          description: New human-readable name for the key.
          example: "Updated key name"
        permissions:
          description: |
            Updated permission set. Same format as for key creation.
            Valid values: `read`, `create`, `update`, `delete`.
          oneOf:
            - type: array
              items:
                type: string
                enum: [read, create, update, delete]
            - type: string
          example: ["read", "create", "update"]
        expires_at:
          type: string
          nullable: true
          description: |
            Updated expiry date/time in UTC (same forms as for key creation; invalid values
            get `422`, `error_code` 132), or `null` to remove the expiry.
          example: "2028-06-01 00:00:00"
    twoFactorVerifyBody:
      type: object
      required:
        - code
      properties:
        JWT:
          type: string
          nullable: true
          description: |
            The interim JWT received in the `POST /auth` Two-Factor challenge response.
            Can be supplied here in the request body or via the `Authorization: Bearer`
            header.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
        code:
          type: string
          description: |
            The 2FA verification code. Accepted formats depend on the user's configured
            provider: a TOTP code (6-digit), an email token, or a backup code.
          example: "123456"
    ApiKeyItem:
      type: object
      properties:
        id:
          type: integer
          description: Database ID of the key.
          example: 7
        name:
          type: string
          description: Human-readable key name.
          example: "My integration key"
        key_prefix:
          type: string
          description: First 8 characters of the key followed by `****`.
          example: "sjl_a1b2****"
        permissions:
          type: array
          items:
            type: string
            enum: [read, create, update, delete]
          example: ["read", "create"]
        expires_at:
          type: string
          nullable: true
          description: Expiry timestamp in `Y-m-d H:i:s` format, or `null`.
          example: null
        last_used_at:
          type: string
          nullable: true
          description: Timestamp of last successful use, or `null` if never used.
          example: "2026-04-15 10:30:00"
        created_at:
          type: string
          description: Timestamp when the key was created.
          example: "2026-01-01 12:00:00"
        revoked_at:
          type: string
          nullable: true
          description: Timestamp when the key was revoked, or `null` if still active.
          example: null
        user_id:
          type: integer
          nullable: true
          description: WordPress user ID who owns this key. Only present in admin responses.
          example: 3
    RevokedTokenItem:
      type: object
      properties:
        id:
          type: integer
          description: Database ID of the revoked-token record.
          example: 7
        user_id:
          type: integer
          description: WordPress user ID the revoked JWT belonged to.
          example: 3
        token_hash_masked:
          type: string
          description: |
            First 8 and last 4 characters of the SHA-256 hash of the revoked JWT, separated
            by `...`. The full hash and the raw JWT are never returned.
          example: "a1b2c3d4...ef01"
        expires_at:
          type: string
          nullable: true
          description: |
            Expiry timestamp (from the JWT's `exp` claim) in `Y-m-d H:i:s` format, or `null`
            if the JWT had no expiry claim.
          example: "2027-01-01 00:00:00"
        revoked_at:
          type: string
          description: Timestamp when the token was revoked.
          example: "2026-01-01 12:00:00"
