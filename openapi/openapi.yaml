paths:
  /autologin:
    get:
      tags:
        - login_user
      summary: Auto-login user into WordPress
      description: |
        Validates the supplied JWT, resolves the matching WordPress user, and redirects the
        browser to the site (or to `redirectUrl` if provided and allowed by settings).

        **Requirements**
        - Auto-login must be enabled in the plugin settings.
        - The JWT must be valid, not expired, and not revoked.
        - If "Auto-Login Requires Auth Code" is enabled, `AUTH_KEY` must be provided.
        - The calling IP must pass any IP allow-list configured in the plugin settings.

        **JWT delivery**
        The JWT can be supplied via:
        - `JWT` query parameter (default)
        - `JWT` in request body
        - `Authorization: Bearer <token>` header (when enabled in plugin General Settings)
        - Cookie or session (when enabled in plugin General Settings)

        A header, cookie, or session JWT is ignored on cross-site requests (`Sec-Fetch-Site: cross-site`,
        or an `Origin` / `Referer` naming another site) to prevent CSRF. Cross-origin browser apps must be
        listed in the CORS "Allow origin" setting; a `*` entry trusts the header JWT only, never the
        cookie or session JWT. Requests without these headers (mobile apps, servers) are not affected.

        **Success behaviour**
        The response is an HTTP redirect (302) to the WordPress home URL or the custom
        `redirectUrl`. The browser session is authenticated as the resolved user.
      operationId: autologin
      security:
        - BearerAuth: []
        - QueryJWT: []
      parameters:
        - name: JWT
          in: query
          description: |
            A valid signed JWT identifying the WordPress user to log in.
            Alternative to the `Authorization: Bearer` header.
          required: false
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
          schema:
            type: string
        - name: AUTH_KEY
          in: query
          example: "MY_SUPER_SECRET_AUTH_CODE"
          description: |
            Required when "Auto-Login Requires Auth Code" is enabled in the plugin settings.
            The parameter name defaults to `AUTH_KEY` but is configurable in the plugin's
            Auth Codes settings.
          schema:
            type: string
        - name: redirectUrl
          in: query
          example: "https://simplejwtlogin.com"
          description: |
            Overrides the redirect URL configured in the plugin settings. The "Allow redirect
            URL override" option must be enabled for this parameter to take effect.
          schema:
            type: string
      responses:
        '200':
          description: |
            Login successful and the "Redirect after auto-login" setting is "No redirect."
            The body can be changed with the `simple_jwt_login_no_redirect_message` filter.
          content:
            application/json:
              example:
                success: true
                message: "User was logged in."
        '302':
          description: |
            Two cases:
            - **Login successful**: redirect to the dashboard (default), the home page, the custom
              URL from the settings or the `redirectUrl` parameter. The WordPress auth cookie is set.
            - **Login failed and "Redirect on fail" is configured**: every error below becomes a
              redirect to that URL with `error_message` and `error_code` appended to the query string.
          headers:
            Location:
              schema:
                type: string
              example: "https://example.com/wp-admin/"
        '400':
          description: |
            The JWT could not be decoded or validated (all JWT library errors return 400):
            - Malformed token: wrong number of segments, bad header/claims/signature encoding (`error_code` 2-5).
            - Algorithm missing, unsupported or not allowed, bad `kid` (`error_code` 6-10).
            - Signature verification failed (`error_code` 11).
            - Token not yet valid (`nbf`/`iat`) or expired (`error_code` 12-14).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                expired:
                  value:
                    success: false
                    data:
                      message: "Expired token"
                      error_code: 14
                malformed:
                  value:
                    success: false
                    data:
                      message: "Wrong number of segments"
                      error_code: 2
        '401':
          description: |
            Unauthorized. One of:
            - The JWT has been revoked, or was issued before the user's last password change (`error_code` 55).
            - The `iss` claim is not on the allowed-issuer list (`error_code` 68).
            - The `aud` claim does not match the expected audience (`error_code` 130).
            - The provided auth code is wrong (`error_code` 27).
            - The JWT is a 2FA interim token: finish the `/auth/2fa` step first (`error_code` 110).
            - The JWT does not contain the claim configured as "JWT login by" parameter (`error_code` 29, 30).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "This JWT is invalid."
                  error_code: 55
        '403':
          description: |
            Forbidden. One of:
            - Auto-login is disabled in the plugin settings (`error_code` 26).
            - The client IP address is not on the allow-list (`error_code` 28).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Auto-login is not enabled on this website."
                  error_code: 26
        '404':
          description: The WordPress user identified by the JWT payload could not be found (`error_code` 24).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "User not found."
                  error_code: 24
        '422':
          description: |
            Unprocessable entity. One of:
            - The JWT is absent from the request (`error_code` 23).
            - The auth code is required by the plugin settings but was not provided (`error_code` 94).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "JWT is missing."
                  error_code: 23
        '500':
          description: Internal server error (any other unexpected error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /users:
    post:
      operationId: registerUser
      tags:
        - register_user
      summary: Register a new WordPress user
      description: |
        Creates a new WordPress user account. At minimum, `email` and `password` must be
        supplied. All standard WordPress user fields (display name, locale, etc.) are
        accepted and passed to `wp_insert_user()`.

        **Requirements**
        - User registration must be enabled in the plugin settings.
        - If "Register Requires Auth Code" is enabled, `AUTH_KEY` must be provided.
        - The calling IP must pass any IP allow-list configured in the plugin settings.
        - The email address must be unique and well-formed.
        - If email domain restrictions are configured, the domain must match.

        **Success behaviour**
        Returns the new user's profile object, their roles, and optionally a JWT if
        "Generate JWT on register" is enabled in the plugin settings.
      requestBody:
        description: New user data. `email` and `password` are required; all other fields are optional.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/registerUserBody'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/registerUserBody'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/registerUserBody'
        required: true
      responses:
        '200':
          description: User registered successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Action status.
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: New user ID.
                        example: 1
                      login:
                        type: string
                        example: "myuser"
                      nicename:
                        type: string
                        example: "myuser"
                      email:
                        type: string
                        example: "myuser@simplejwtlogin.com"
                      url:
                        type: string
                        description: User URL. Empty string when not set.
                        example: ""
                      registered:
                        type: string
                        example: "2021-01-01 23:31:50"
                      status:
                        type: string
                        example: "0"
                      display_name:
                        type: string
                        example: "myuser"
                      roles:
                        type: array
                        items:
                          type: string
                          example: "subscriber"
                      jwt:
                        type: string
                        nullable: true
                        description: Only present when "Generate JWT on register" is enabled.
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
        '302':
          description: |
            User registered and logged in. Returned when auto-login is enabled together with
            "Force login after register": the browser is redirected the same way as
            `GET /autologin` (or a `200` JSON body is returned when "No redirect" is configured).
          headers:
            Location:
              schema:
                type: string
              example: "https://example.com/wp-admin/"
        '400':
          description: |
            The JWT for the new user could not be signed (JWT library error, for example, OpenSSL
            signing failure `error_code` 16). Only when "Generate JWT on register" is enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "OpenSSL unable to sign data"
                  error_code: 16
        '401':
          description: |
            Unauthorized. The auth code does not match any configured auth code (`error_code` 27).
            An auth code is validated whenever it is sent, even when it is not required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Invalid Auth Code ( AUTH_KEY ) provided."
                  error_code: 27
        '403':
          description: |
            Forbidden. One of:
            - User registration is disabled in the plugin settings (`error_code` 31).
            - The client IP address is not on the allow-list (`error_code` 33).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Register is not allowed."
                  error_code: 31
        '409':
          description: A WordPress user with the provided email address or `user_login` already exists (`error_code` 38).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "User already exists."
                  error_code: 38
        '422':
          description: |
            Unprocessable entity. One of:
            - `email` is missing, or `password` is missing while "Random password" is off (`error_code` 35).
            - The email address format is invalid (`error_code` 36).
            - The `user_login` exceeds 60 characters, or the email address (used as
              login when `user_login` is omitted) exceeds 60 characters (`error_code` 36).
            - The email domain is not permitted by the plugin's domain allow-list
              (`error_code` 37).
            - The auth code is required but was not provided (`error_code` 94).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                missingEmail:
                  value:
                    success: false
                    data:
                      message: "Missing email."
                      error_code: 35
                invalidEmail:
                  value:
                    success: false
                    data:
                      message: "Invalid email address."
                      error_code: 36
                domainNotAllowed:
                  value:
                    success: false
                    data:
                      message: "This website does not allows users from this domain."
                      error_code: 37
        '500':
          description: |
            Internal server error. WordPress `wp_insert_user()` returned an error (`error_code` 52,
            the message is the WordPress error), or an unexpected internal failure occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Sorry, that username already exists!"
                  error_code: 52
    delete:
      tags:
        - delete_user
      summary: Delete a WordPress user
      description: |
        Permanently deletes the WordPress user identified by the JWT payload. The JWT is
        decoded to extract the user identifier (email, ID, or login, depending on plugin
        settings), the user is looked up, and `wp_delete_user()` is called.

        **Requirements**
        - User deletion must be enabled in the plugin settings.
        - The JWT must be valid, not expired, and not revoked.
        - If "Delete Requires Auth Code" is enabled, `AUTH_KEY` must be provided.
        - The calling IP must pass any IP allow-list configured in the plugin settings.
      operationId: deleteUser
      parameters:
        - name: JWT
          in: query
          description: |
            A valid signed JWT identifying the WordPress user to delete. Can also be sent in the
            `Authorization` header, cookie, or session (when enabled in General Settings).
          required: false
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
          schema:
            type: string
        - name: AUTH_KEY
          in: query
          example: "MY_SUPER_SECRET_AUTH_CODE"
          description: |
            Required when "Delete User Requires Auth Code" is enabled in the plugin settings.
            The parameter name defaults to `AUTH_KEY` but is configurable in the plugin's
            Auth Codes settings.
          schema:
            type: string
      responses:
        '200':
          description: |
            User deleted. Their refresh tokens and revoked-token records are removed too.
            The body can be changed with the `simple_jwt_login_response_delete_user` filter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        description: Confirmation message.
                        example: User was successfully deleted.
        '400':
          description: |
            The JWT could not be decoded or validated (all JWT library errors return 400):
            malformed token (`error_code` 2-5), algorithm/`kid` problems (`error_code` 6-10),
            bad signature (`error_code` 11), not yet valid or expired (`error_code` 12-14).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Expired token"
                  error_code: 14
        '401':
          description: |
            Unauthorized. One of:
            - The JWT has been revoked, or was issued before the user's last password change (`error_code` 55).
            - The `aud` claim does not match the expected audience (`error_code` 130).
            - The provided auth code is wrong (`error_code` 27).
            - The JWT is a 2FA interim token: finish the `/auth/2fa` step first (`error_code` 110).
            - The JWT does not contain the claim configured as "JWT login by" parameter (`error_code` 29, 30).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "This JWT is invalid."
                  error_code: 55
        '403':
          description: |
            Forbidden. One of:
            - User deletion is disabled in the plugin settings (`error_code` 39).
            - The client IP address is not on the allow-list (`error_code` 41).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Delete is not enabled."
                  error_code: 39
        '404':
          description: The WordPress user identified by the JWT payload could not be found (`error_code` 24).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "User not found."
                  error_code: 24
        '422':
          description: |
            Unprocessable entity. One of:
            - The JWT is absent from the request (`error_code` 42).
            - The auth code is required but was not provided (`error_code` 94).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "The `jwt` parameter is missing."
                  error_code: 42
        '500':
          description: Internal server error (any other unexpected error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /user/reset_password:
    post:
      tags:
        - reset_password
      operationId: sendResetPasswordCode
      summary: Send reset password email
      description: |
        Sends a one-time reset code to the user's registered email address. The code must
        then be supplied to `PUT /user/reset_password` together with the new password.

        **Requirements**
        - Password reset must be enabled in the plugin settings.
        - If "Reset Password Requires Auth Code" is enabled, `AUTH_KEY` must be provided.

        An email that does not belong to a WordPress user gets the same `200` answer as one
        that does (nothing is sent), so the endpoint can not be used to find which emails
        have an account. Exception: the `simple_jwt_login_response_send_reset_password`
        filter and the reset password webhooks run only for real users. When they change
        the response or add a delay, callers can tell which emails exist.

        **Flow**
        1. Call `POST /user/reset_password` with `email` (and `AUTH_KEY` if required).
        2. The user receives an email containing a one-time `code`.
        3. Call `PUT /user/reset_password` with `email`, `code`, and `new_password`.
      requestBody:
        description: Email address of the account whose password should be reset.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/resetPasswordBody'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/resetPasswordBody'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/resetPasswordBody'
        required: true
      responses:
        '200':
          description: |
            Request accepted (also for emails without an account). The message depends on the
            "Reset password flow" setting.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Reset password email has been sent.
              examples:
                emailSent:
                  summary: Flow "send default WordPress email" or "send custom email"
                  value:
                    success: true
                    data:
                      message: "Reset password email has been sent."
                codeSaved:
                  summary: Flow "just save the code in the database"
                  value:
                    success: true
                    data:
                      message: "The Code has been saved into the database."
        '400':
          $ref: '#/components/responses/RestInvalidJson'
        '401':
          description: |
            Unauthorized. The provided auth code is wrong (`error_code` 27).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Invalid Auth Code ( AUTH_KEY ) provided."
                  error_code: 27
        '403':
          description: |
            Forbidden. Password reset is disabled in the plugin settings (`error_code` 56).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Reset Password is not allowed."
                  error_code: 56
        '422':
          description: |
            Unprocessable entity. One of:
            - The `email` field is missing (`error_code` 63).
            - The email address format is invalid (`error_code` 96).
            - The auth code is required but was not provided (`error_code` 94).
            - The configured reset password flow is invalid (`error_code` 65).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                missingEmail:
                  value:
                    success: false
                    data:
                      message: "Missing email parameter."
                      error_code: 63
                invalidEmail:
                  value:
                    success: false
                    data:
                      message: "Invalid email parameter."
                      error_code: 96
        '500':
          description: |
            Internal server error, for example, WordPress could not send the reset email. The message
            is the one of the underlying error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
    put:
      tags:
        - reset_password
      operationId: changeUserPassword
      summary: Change user password
      description: |
        Sets a new password for the user. Two authentication modes are supported:

        **Code-based (default)**
        Provide `email`, the one-time `code` received by email (from `POST /user/reset_password`),
        and `new_password`.

        **JWT-based (optional)**
        When "Allow Reset Password with JWT" is enabled in the plugin settings, provide a
        valid `JWT` and `new_password`. The `code` field is not required in this mode.
        Note: JWTs that were themselves issued via a reset-password flow cannot be reused
        to change a password again.

        **Sessions are revoked** (when the `authorization.revoke_on_password_change` setting is on; off by default)
        After a password change through this endpoint or `wp-login.php` (and, on WordPress 5.8+,
        the user profile, the admin or `/wp/v2/users`), the user's refresh tokens are deleted and every JWT issued before
        the change (older `iat`, or no `iat`) is rejected with error code 55. Log in again
        to get a new JWT.

        **Requirements**
        - Password reset must be enabled in the plugin settings.
        - If "Reset Password Requires Auth Code" is enabled, `AUTH_KEY` must be provided.
      requestBody:
        description: New password plus either a one-time code or a valid JWT for authentication.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/changePasswordBody'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/changePasswordBody'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/changePasswordBody'
        required: true
      responses:
        '200':
          description: |
            Password changed. The body can be changed with the
            `simple_jwt_login_response_change_user_password` filter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: User Password has been changed.
        '400':
          description: |
            JWT mode only. The JWT could not be decoded or validated (JWT library errors,
            for example, expired `error_code` 14, bad signature `error_code` 11).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Expired token"
                  error_code: 14
        '401':
          description: |
            Unauthorized. One of:
            - JWT mode: the JWT user does not exist or its email is not the `email` parameter (`error_code` 93).
            - JWT mode: the JWT has been revoked or was issued before the last password change (`error_code` 55).
            - The provided auth code is wrong (`error_code` 27).
            - The JWT is a 2FA interim token: finish the `/auth/2fa` step first (`error_code` 110).
            - The JWT does not contain the claim configured as "JWT login by" parameter (`error_code` 29, 30).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "This JWT can not change your password."
                  error_code: 93
        '403':
          description: |
            Forbidden. Password reset is disabled in the plugin settings (`error_code` 56).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Reset Password is not allowed."
                  error_code: 56
        '422':
          description: |
            Unprocessable entity. One of:
            - The `email` field is missing (`error_code` 59).
            - The `new_password` field is missing (`error_code` 61).
            - "Password is base64 encoded" is on and `new_password` is not valid base64 (`error_code` 63).
            - JWT-based reset is enabled but neither `code` nor a JWT was provided
              (`error_code` 53).
            - JWT-based reset is disabled and the `code` field is missing
              (`error_code` 60).
            - The email address format is invalid (`error_code` 95).
            - The one-time reset code is invalid, expired, or belongs to another email (`error_code` 62).
            - The auth code is required but was not provided (`error_code` 94).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                invalidCode:
                  value:
                    success: false
                    data:
                      message: "Invalid code provided."
                      error_code: 62
                missingNewPassword:
                  value:
                    success: false
                    data:
                      message: "Missing new_password parameter."
                      error_code: 61
                missingCodeOrJwt:
                  value:
                    success: false
                    data:
                      message: "Missing code or jwt parameter."
                      error_code: 53
        '500':
          description: Internal server error (any other unexpected error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /auth:
    post:
      tags:
        - authenticate_user
      summary: Authenticate and obtain a JWT
      description: |
        Validates the user's WordPress credentials and returns a signed JWT. An optional
        refresh token is also returned when the refresh-token feature is enabled in the
        plugin settings.

        **Credentials**
        Supply one of `email`, `username` or `login` (username or email). When several are
        sent, `username` wins over `email`, and `email` wins over `login`. Plus one of:
        - `password` - plaintext password, verified with `wp_authenticate()`, so the
          `authenticate` / `wp_authenticate_user` filters of login protection plugins
          (lockouts, blocked users) apply. Application passwords are not accepted.
        - `password_hash` - the hashed password as stored in the WordPress database
          (must be enabled in the plugin settings)

        Every failed attempt (unknown user, wrong password or hash) fires
        `wp_login_failed`, so brute-force plugins count it.

        **Requirements**
        - Authentication must be enabled in the plugin settings.
        - If "Authentication Requires Auth Code" is enabled, `AUTH_KEY` must be provided.

        **Custom payload claims**
        Optionally supply `payload` as a JSON-encoded object to add extra claims to the
        issued JWT. Reserved identity claims are always derived from the authenticated
        user and cannot be overridden this way.

        **Two-Factor Authentication**
        When the authenticated user has Two-Factor Authentication enabled and the 2FA
        integration is active, the endpoint returns HTTP 200 with a challenge response
        instead of a regular JWT. The `two_factor_required` field is `true` and `jwt`
        contains a short-lived interim token. Submit that interim token together with the
        2FA code to `POST /auth/2fa` to obtain the final JWT.
      operationId: getJWT
      requestBody:
        description: User credentials.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/authBody'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/authBody'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/authBody'
        required: true
      responses:
        '200':
          description: |
            Authentication successful. Returns a signed JWT and an optional refresh token.

            **Two-Factor challenge**: when the user has 2FA enabled, this response is
            returned instead of a regular JWT. `two_factor_required` is `true` and
            `jwt` contains a short-lived interim token. Submit it with the 2FA code
            to `POST /auth/2fa` to obtain the final JWT.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Action status.
                    example: true
                  data:
                    type: object
                    properties:
                      jwt:
                        type: string
                        description: |
                          Signed JWT for use in subsequent requests, or a short-lived
                          interim JWT when `two_factor_required` is `true`.
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
                      refresh_token:
                        type: string
                        nullable: true
                        description: |
                          Opaque refresh token for obtaining new JWTs without re-authenticating.
                          Only present when the refresh-token feature is enabled and 2FA is
                          not required.
                        example: "a1b2c3d4e5f678901234567890123456789012345678901234567890123456789012"
                      two_factor_required:
                        type: boolean
                        nullable: true
                        description: |
                          Present and `true` only when Two-Factor Authentication is required.
                          When set, `jwt` is an interim token; complete authentication via
                          `POST /auth/2fa`.
                        example: true
                      provider:
                        type: string
                        nullable: true
                        description: |
                          Fully qualified class name of the user's primary 2FA provider.
                          Only present when `two_factor_required` is `true`.
                        example: "Two_Factor_Totp"
              examples:
                jwt:
                  summary: Regular login (refresh tokens enabled)
                  value:
                    success: true
                    data:
                      jwt: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NjMyOTk0MDAsImVtYWlsIjoiam9obkBkb2UuY29tIiwiaWQiOjEsInVzZXJuYW1lIjoibXl1c2VyIn0.signature"
                      refresh_token: "a1b2c3d4e5f678901234567890123456789012345678901234567890123456789012"
                twoFactorChallenge:
                  summary: User has Two-Factor enabled
                  value:
                    success: true
                    data:
                      jwt: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ0ZmFfcGVuZGluZyI6MX0.signature"
                      two_factor_required: true
                      provider: "Two_Factor_Totp"
        '400':
          description: |
            The JWT could not be signed (JWT library error, for example, OpenSSL signing failure
            `error_code` 16, or a bad private key / algorithm `error_code` 1, 7, 17).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "OpenSSL unable to sign data"
                  error_code: 16
        '401':
          description: |
            Unauthorized. One of:
            - The user does not exist, or the password / password hash is wrong (`error_code` 48).
              When "Password is base64 encoded" is on, a value that is not valid base64 is also
              treated as wrong credentials.
            - The provided auth code is wrong (`error_code` 27).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Wrong user credentials."
                  error_code: 48
        '403':
          description: |
            Forbidden. One of:
            - Authentication is disabled in the plugin settings (`error_code` 45).
            - The client IP address is not on the allow-list configured in the plugin
              settings (`error_code` 41).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Authentication is not enabled."
                  error_code: 45
        '422':
          description: |
            Unprocessable entity. One of:
            - The `email`, `username`, or `login` field is missing (`error_code` 46).
            - The `password` or `password_hash` field is missing (`error_code` 47).
            - The `password_hash` field was provided but "Allow login with password hash"
              is not enabled in the plugin settings (`error_code` 113).
            - The auth code is required but was not provided (`error_code` 94).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "The email, username, or login parameter is missing from the request."
                  error_code: 46
        '500':
          description: |
            Internal server error. One of:
            - The refresh token could not be saved in the database (`error_code` 131).
            - The 2FA nonce for the challenge could not be created (`error_code` 133).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Unable to save the refresh token."
                  error_code: 131
  /auth/refresh:
    post:
      tags:
        - authenticate_user
      summary: Refresh an expired JWT
      description: |
        Exchanges a valid refresh token for a new JWT (and a new refresh token). The
        original refresh token is single-use: when several requests send the same token
        at once, only one of them gets a new JWT, the others answer "Invalid refresh token."

        **Requirements**
        - The refresh-token feature must be enabled in the plugin settings.
        - The refresh token must exist in the database and not have exceeded the maximum
          token age configured in the plugin settings.
        - Authentication must be enabled in the plugin settings.
        - If "Refresh Token Requires Auth Code" is enabled, `AUTH_KEY` must be provided.
        - If a JWT is also sent (header, cookie, session or `JWT` parameter) and it has been
          revoked, the request is rejected. Any other problem with that JWT (for example, expired) is ignored.

        **Custom payload claims**
        Optionally supply `payload` as a JSON-encoded object to add extra claims to the
        newly issued JWT. Reserved identity claims are always derived from the
        authenticated user and cannot be overridden this way.
      operationId: refreshJWT
      requestBody:  
        description: Refresh token obtained from a prior `/auth` response.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/authRefreshBody'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/authRefreshBody'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/authRefreshBody'
        required: true
      responses:
        '200':
          description: JWT refreshed successfully. Returns a new JWT and a new refresh token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Action status.
                    example: true
                  data:
                    type: object
                    properties:
                      jwt:
                        type: string
                        description: Newly issued JWT.
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
                      refresh_token:
                        type: string
                        description: New refresh token replacing the one that was consumed.
                        example: "f6e7a8b9c0d123456789012345678901234567890123456789012345678901234567"
        '400':
          description: |
            The new JWT could not be signed (JWT library error, for example, OpenSSL signing failure
            `error_code` 16).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "OpenSSL unable to sign data"
                  error_code: 16
        '401':
          description: |
            Unauthorized. One of:
            - The refresh token was not found in the database (expired, already rotated,
              or never issued) (`error_code` 51).
            - A JWT was supplied alongside the refresh token but has been revoked -
              revoked JWTs cannot be used to obtain new tokens (`error_code` 55).
            - The WordPress user linked to the refresh token no longer exists
              (`error_code` 55).
            - The provided auth code is wrong (`error_code` 27).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Invalid refresh token."
                  error_code: 51
        '403':
          description: |
            Forbidden. One of:
            - The refresh-token feature is disabled in the plugin settings (`error_code` 81).
            - Authentication is disabled in the plugin settings (`error_code` 45).
            - The client IP address is not on the allow-list (`error_code` 41).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Refresh Token endpoint is not enabled."
                  error_code: 81
        '422':
          description: |
            Unprocessable entity. One of:
            - The `refresh_token` field is absent from the request (`error_code` 51).
            - The auth code is required but was not provided (`error_code` 94).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Refresh token is missing."
                  error_code: 51
        '500':
          description: |
            The new refresh token could not be saved in the database (`error_code` 131).
            The old refresh token is already used up, so the client must log in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              example:
                success: false
                data:
                  message: "Unable to save the refresh token."
                  error_code: 131
  /auth/validate:
    get:
      tags:
        - authenticate_user
      summary: Validate a JWT and retrieve user details
      description: |
        Verifies the JWT signature, checks expiry and revocation status, and returns the
        decoded token information together with the matching WordPress user profile and roles.

        **Audience**
        When an expected audience is configured (plugin setting `authorization.aud`, or the
        `audience` of the JWT Rule the token matches), the JWT `aud` claim (a string or a list)
        must contain it. Otherwise this and every other JWT endpoint answers `401` with
        `error_code` 130. JWTs from `/auth`, `/auth/refresh`, register and OAuth carry the
        plugin audience when it is set.

        **JWT delivery**
        The JWT can be passed via:
        - `JWT` query parameter
        - `Authorization: Bearer <token>` header (when enabled in plugin General Settings)
        - Cookie or session (when enabled in plugin General Settings)

        A header, cookie, or session JWT is ignored on cross-site requests (`Sec-Fetch-Site: cross-site`,
        or an `Origin` / `Referer` naming another site) to prevent CSRF. Cross-origin browser apps must be
        listed in the CORS "Allow origin" setting; a `*` entry trusts the header JWT only, never the
        cookie or session JWT. Requests without these headers (mobile apps, servers) are not affected.

        **Requirements**
        - Authentication and the validate endpoint must be enabled in the plugin settings.
        - The calling IP must pass the authentication IP allow-list.
        - If "Validate Token Requires Auth Code" is enabled, `AUTH_KEY` must be provided.

        The response can be changed with the `simple_jwt_login_response_validate_token` filter.
      operationId: validateJWT
      security:
        - BearerAuth: []
        - QueryJWT: []
      parameters:
        - name: JWT
          in: query
          description: "The JWT to validate. Alternative to the `Authorization: Bearer` header."
          required: false
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
          schema:
            type: string
        - name: AUTH_KEY
          in: query
          example: "MY_SUPER_SECRET_AUTH_CODE"
          description: |
            Required when "Validate Token Requires Auth Code" is enabled. The parameter
            name defaults to `AUTH_KEY` but is configurable in the plugin's Auth Codes
            settings.
          schema:
            type: string
      responses:
        '200':
          description: JWT is valid. Returns the decoded token and the associated WordPress user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          ID:
                            type: string
                            example: "1"
                          user_login:
                            type: string
                            example: "myuser"
                          user_nicename:
                            type: string
                            example: "myuser"
                          user_email:
                            type: string
                            example: "myuser@simplejwtlogin.com"
                          user_url:
                            type: string
                            example: "https://simplejwtlogin.com/myuser"
                          user_registered:
                            type: string
                            example: "2021-01-01 23:31:50"
                          user_status:
                            type: string
                            example: "0"
                          display_name:
                            type: string
                            example: "myuser"
                      roles:
                        type: array
                        items:
                          type: string
                          example: "administrator"
                      jwt:
                        type: object
                        properties:
                          token:
                            type: string
                            example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
                          header:
                            type: object
                            properties:
                              typ:
                                type: string
                                example: "JWT"
                              alg:
                                type: string
                                example: "HS256"
                          payload:
                            type: object
                            properties:
                              iat:
                                type: number
                                description: Issued-at timestamp. Always present.
                                example: 1516239022
                              exp:
                                type: number
                                nullable: true
                                description: Expiry timestamp. Present only when the `exp` payload parameter is enabled in plugin settings.
                                example: 1516242622
                              email:
                                type: string
                                nullable: true
                                description: User email. Present only when enabled in plugin settings.
                                example: "myuser@simplejwtlogin.com"
                              id:
                                type: string
                                nullable: true
                                description: WordPress user ID, as a numeric string (as WordPress stores it). Present only when enabled in plugin settings.
                                example: "1"
                              site:
                                type: string
                                nullable: true
                                description: Site URL. Present only when enabled in plugin settings.
                                example: "https://simplejwtlogin.com"
                              username:
                                type: string
                                nullable: true
                                description: WordPress login username. Present only when enabled in plugin settings.
                                example: "myuser"
                              iss:
                                type: string
                                nullable: true
                                description: Issuer claim. Present only when enabled in plugin settings.
                                example: "https://simplejwtlogin.com"
                              jti:
                                type: string
                                nullable: true
                                description: Unique, random JWT ID (32 hexadecimal characters), new for every issued token. Enabled by default; present unless turned off in plugin settings.
                                example: "9f86d081884c7d659a2feaa0c55ad015"
                          expire_in:
                            type: integer
                            nullable: true
                            description: |
                              Seconds until the JWT expires (`exp - now`). Only present
                              when the JWT payload contains an `exp` claim.
                            example: 3600
        '400':
          description: |
            The JWT could not be decoded or validated (all JWT library errors return 400):
            - Malformed token: wrong number of segments, bad header/claims/signature encoding (`error_code` 2-5).
            - Algorithm missing, unsupported or not allowed, bad `kid` (`error_code` 6-10).
            - Signature verification failed (`error_code` 11).
            - Token not yet valid (`nbf`/`iat`) or expired (`error_code` 12-14).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                expired:
                  value:
                    success: false
                    data:
                      message: "Expired token"
                      error_code: 14
                badSignature:
                  value:
                    success: false
                    data:
                      message: "Signature verification failed"
                      error_code: 11
        '401':
          description: |
            Unauthorized. One of:
            - The JWT has been revoked, or was issued before the user's last password change (`error_code` 55).
            - The `aud` claim does not match the expected audience (`error_code` 130).
            - The provided auth code is wrong (`error_code` 27).
            - The JWT is a 2FA interim token: finish the `/auth/2fa` step first (`error_code` 110).
            - The JWT does not contain the claim configured as "JWT login by" parameter (`error_code` 29, 30).
          content:
            application/json:
