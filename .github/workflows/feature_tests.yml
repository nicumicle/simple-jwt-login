name: Feature Tests

on:
  # Called by tests.yml (unit + feature, then cross-site).
  workflow_call:

env:
  SITE_URL: simplejwtlogin.local
  DB_PASSWORD: root
  WP_USER: admin
  WP_PASSWORD: admin
  WP_EMAIL: contact@simplejwtlogin.com

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    name: Simple-JWT-Login Feature tests
    strategy:
      matrix:
        php_version: [ 8.4, 8.5 ]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "🔧 Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          extension: mbstring, intl #setup extensions
          ini-values: post_max_size=256M, short_open_tag=Off, error_reporting=E_ALL, display_errors=On, display_startup_errors=On  #setup php.ini configuration
          coverage: none # feature tests run against Apache, CLI coverage is meaningless
        env:
          update: true #install the latest patch release, older ones are rejected by roave/security-advisories
          pecl: false

      -   name: "🚧 MySQL Setup"
          run: |
            sudo /etc/init.d/mysql start
            mysql --user="root" --password="root" --execute="ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '$DB_PASSWORD';"
      -   name: "🚧 Apache Setup"
          run: |
            sudo add-apt-repository -y ppa:ondrej/php
            sudo apt-get update
            sudo apt-get install -y libapache2-mod-php${{ matrix.php_version }}
            sudo a2enmod php${{ matrix.php_version }}
            # The session JWT tests write sess_* files that Apache must read. Debian's default
            # (/var/lib/php/sessions) is root only and apache2.service uses PrivateTmp, so /tmp
            # is not shared either. No sticky bit: fs.protected_regular blocks www-data from
            # opening the runner's sess_* files in a sticky dir. SJL_SESSION_DIR in the test step must match.
            sudo mkdir -p /var/lib/sjl-sessions && sudo chmod 0777 /var/lib/sjl-sessions
            echo "session.save_path = /var/lib/sjl-sessions" | sudo tee /etc/php/${{ matrix.php_version }}/apache2/conf.d/99-sjl-tests.ini
            # Pretty permalinks (/wp-json/..., /index.php/wp-json/...) need mod_rewrite and .htaccess,
            # like the local docker setup. ProtectEndpoints tests hit every URL form.
            sudo a2enmod rewrite
            printf '<Directory /var/www/html>\n    AllowOverride All\n</Directory>\n' | sudo tee /etc/apache2/conf-available/sjl-tests.conf
            sudo a2enconf sjl-tests
            sudo /etc/init.d/apache2 start
      -   name: "🚧 Install WordPress"
          run: |
            echo "PATH:"
            echo "$PATH"

            sudo chmod -R 777 /var/www/html
            sudo rm -rf /var/www/html/*

            curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
                        
            sudo mv wp-cli.phar /usr/local/bin/wp
            sudo chmod +x /usr/local/bin/wp

            wp core download --path=/var/www/html/
            wp config create --dbname=wordpress --dbuser=root --dbpass=$DB_PASSWORD --dbhost=localhost --dbprefix=wp_ --path=/var/www/html
            
            chmod 600 /var/www/html/wp-config.php
            
            wp db create --path=/var/www/html
            wp db check --path=/var/www/html
            wp core install --url="$SITE_URL" --title="Test WP" --admin_user="$WP_USER" --admin_password="$WP_PASSWORD" --admin_email="$WP_EMAIL" --path=/var/www/html
            wp option get siteurl --path=/var/www/html
            wp config set --raw WP_DEBUG true --path=/var/www/html
            wp config set --raw WP_DEBUG_LOG true --path=/var/www/html
            # Errors go to wp-content/debug.log (shown by "Server logs" on failure). Displaying them
            # would prepend HTML notices (e.g. WooCommerce's early textdomain notice) to JSON responses.
            wp config set --raw WP_DEBUG_DISPLAY false --path=/var/www/html
            wp rewrite structure '/%postname%/' --path=/var/www/html
            cat > /var/www/html/.htaccess <<'HTACCESS'
            # BEGIN WordPress
            <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
            RewriteBase /
            RewriteRule ^index\.php$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.php [L]
            </IfModule>
            # END WordPress
            HTACCESS

            echo "127.0.0.1 $SITE_URL" | sudo tee -a /etc/hosts
      -   name: "🚧 Init the plugin"
          run: |
            cp -R simple-jwt-login /var/www/html/wp-content/plugins
            wp plugin activate simple-jwt-login --path=/var/www/html
            # Bridges covered by tests/Feature/Security/AmbientJwtEntryPointsTest.
            wp plugin install woocommerce wp-graphql --activate --path=/var/www/html
      -   name: "🚧 Prepare Feature tests"
          run: |
            cp phpunit.xml.actions.dist /var/www/html/wp-content/plugins/phpunit.xml
            cp composer.json /var/www/html/wp-content/plugins/           
            cp bootstrap.php /var/www/html/wp-content/plugins/            
            cp -R tests /var/www/html/wp-content/plugins
            cd /var/www/html/wp-content/plugins
            composer install --prefer-dist --no-progress

            mkdir -p /var/www/html/wp-content/plugins/.phpunit.cache
            sudo chmod -R 777 /var/www/html/wp-content/plugins/.phpunit.cache/
      -   name: "🚧 Change /var/www/html owner"
          run: |
            sudo chown -R www-data:www-data /var/www/html
            # Feature tests copy fixture mu-plugins (tests/Feature/fixtures) here.
            sudo mkdir -p /var/www/html/wp-content/mu-plugins
            sudo chmod 777 /var/www/html/wp-content/mu-plugins
      -   name: "🚑️ Site healthcheck"
          run: |
            echo "🩺 Healthcheck WordPress endpoint"
            curl -v "http://$SITE_URL/index.php?rest_route=/wp/v2/users"
            echo "🩺 Healthcheck Simple-JWT-Login endpoint"
            curl -X POST -v "http://$SITE_URL/index.php?rest_route=/simple-jwt-login/v1/users"

      -   name: "🧪 Run the Feature tests"
          run: |
            cd /var/www/html
            echo "🔖 WordPress Version:  $(wp core version)"
            echo "🔖 PHP Version: $(php -v)"
            
            cd /var/www/html/wp-content/plugins/
            echo "🧪 Running the tests..."
            # Run as www-data: PHP only opens sess_* files owned by its own uid, and the session JWT
            # tests write them for Apache (www-data) to read.
            sudo -u www-data env SJL_SESSION_DIR=/var/lib/sjl-sessions "$(command -v php)" vendor/bin/phpunit --testsuite "Feature" --testdox --no-coverage
      -   name: "🩻 Server logs"
          if: failure()
          run: |
            sudo tail -n 200 /var/log/apache2/error.log || true
            sudo tail -n 200 /var/www/html/wp-content/debug.log || true
